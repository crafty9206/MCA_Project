spring:
  application:
    name: maatricare-backend
  profiles:
    active:
      - local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/maatricare}
    username: ${DATABASE_USERNAME:maatricare}
    password: ${DATABASE_PASSWORD:maatricare}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:maatricare-local-development-secret-key-please-change}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  login-protection:
    maximum-failures: ${LOGIN_MAXIMUM_FAILURES:5}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}

assistant:
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma3:1b}

notifications:
  scheduler:
    enabled: ${NOTIFICATION_SCHEDULER_ENABLED:true}
    interval-ms: ${NOTIFICATION_SCHEDULER_INTERVAL_MS:30000}
  web-push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:support@maatricare.local}
    api-base-url: ${NOTIFICATION_API_BASE_URL:http://localhost:8080/api}
