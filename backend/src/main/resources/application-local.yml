spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/maatricare?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret: local-development-secret-key-that-is-at-least-32-characters
  password-reset:
    expose-token: true